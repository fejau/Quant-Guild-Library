[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "felix-ibkr-ai-trader"
version = "0.1.0"
description = "Account-specific IBKR research terminal with staged, human-approved execution."
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0,<4",
  "httpx>=0.27,<1",
  "openai>=1.0,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["app", "config"]
packages = ["agent", "brain", "ib_bridge", "risk", "trading"]
